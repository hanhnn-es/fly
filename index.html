<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <link rel="icon" href="data:,">
  <title>Flight Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
      --bg:#080b10;--panel:#111720;--line:#293547;--text:#f1f5f9;
      --muted:#8492a6;--blue:#38bdf8;--green:#4ade80;--amber:#fbbf24;--red:#fb4e68;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:var(--text); user-select:none; touch-action:none;
      background:radial-gradient(circle at 50% 115%,rgba(56,189,248,.11),transparent 44%),var(--bg);
    }
    button { font:inherit; }
    .app {
      --edge:8px;
      width:100%; height:100%; min-width:0; min-height:0;
      display:grid; grid-template-rows:42px minmax(0,1fr) 30px; gap:8px;
      padding:max(var(--edge),env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
        max(var(--edge),env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    }
    header,footer { display:flex; align-items:center; justify-content:space-between; min-width:0; gap:8px; }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-icon {
      width:32px; height:32px; flex:none; display:grid; place-items:center;
      border:1px solid #334155; border-radius:10px;
      background:linear-gradient(145deg,#172231,#0d1219); color:var(--blue); font-size:17px;
    }
    .brand-copy { min-width:0; line-height:1; }
    .brand-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.86rem; font-weight:850; letter-spacing:.09em; }
    .brand-sub { margin-top:5px; color:var(--muted); font-size:.58rem; letter-spacing:.12em; white-space:nowrap; }
    .header-actions { display:flex; align-items:center; gap:7px; min-width:0; max-width:58%; flex-shrink:0; }
    .fullscreen-button {
      appearance:none; flex:none; padding:7px 9px; border:1px solid var(--line); border-radius:999px;
      background:rgba(17,23,32,.85); color:#b9c5d4; font-size:.58rem; font-weight:800;
      letter-spacing:.08em; cursor:pointer; touch-action:manipulation;
    }
    .fullscreen-button:active,.command:active { transform:translateY(1px); }
    .link-state {
      display:flex; align-items:center; gap:8px; min-width:0; padding:7px 11px;
      border:1px solid var(--line); border-radius:999px; background:rgba(17,23,32,.85);
      color:var(--muted); font-size:.7rem; font-weight:700;
    }
    .link-dot { width:7px; height:7px; flex:none; border-radius:50%; color:var(--red); background:currentColor; box-shadow:0 0 10px currentColor; }
    .link-state.online { color:var(--green); border-color:rgba(74,222,128,.28); }
    #linkText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    main {
      min-width:0; min-height:0; display:grid; align-items:stretch;
      grid-template-columns:minmax(0,1fr) clamp(110px,18vw,150px) minmax(0,1fr);
      grid-template-areas:"left center right"; gap:clamp(8px,2vw,24px);
    }
    .stick-panel { min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:6px; }
    .stick-panel.left { grid-area:left; }
    .stick-panel.right { grid-area:right; }
    .stick-head { display:flex; align-items:center; justify-content:space-between; gap:5px; padding:0 4px; min-width:0; }
    .stick-name { color:#b9c5d4; font-size:.7rem; font-weight:800; letter-spacing:.13em; }
    .stick-value { color:var(--blue); font:700 .68rem/1 ui-monospace,monospace; white-space:nowrap; }
    .pad-wrap { min-width:0; min-height:0; display:grid; place-items:center; }
    .pad {
      position:relative; width:min(100%,330px); max-width:330px; aspect-ratio:1;
      border:1px solid #2a3545; border-radius:50%; overflow:hidden;
      background:radial-gradient(circle,transparent 0 24%,rgba(56,189,248,.05) 24.5% 25%,transparent 25.5% 49%,rgba(56,189,248,.06) 49.5% 50%,transparent 50.5%),
        linear-gradient(90deg,transparent calc(50% - .5px),#263141 50%,transparent calc(50% + .5px)),
        linear-gradient(0deg,transparent calc(50% - .5px),#263141 50%,transparent calc(50% + .5px)),
        radial-gradient(circle at 50% 45%,#141c27,#0d1219 72%);
      box-shadow:inset 0 0 44px rgba(0,0,0,.32),0 10px 35px rgba(0,0,0,.18);
    }
    .pad:after { content:""; position:absolute; inset:12%; border:1px dashed rgba(132,146,166,.13); border-radius:50%; pointer-events:none; }
    .stick-zone { position:absolute; inset:0; z-index:2; }
    .axis { position:absolute; z-index:1; color:#66758a; font-size:.56rem; font-weight:800; letter-spacing:.08em; pointer-events:none; }
    .axis.top { top:12px; left:50%; transform:translateX(-50%); }
    .axis.bottom { bottom:12px; left:50%; transform:translateX(-50%); }
    .axis.left { left:12px; top:50%; transform:translateY(-50%); }
    .axis.right { right:12px; top:50%; transform:translateY(-50%); }
    .command-panel { grid-area:center; min-width:0; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:8px; }
    .flight-state { flex-shrink:0; padding:9px 8px; border:1px solid var(--line); border-radius:12px; background:var(--panel); text-align:center; }
    .flight-state small { display:block; color:var(--muted); font-size:.54rem; font-weight:800; letter-spacing:.14em; }
    .flight-state strong { display:block; margin-top:5px; color:var(--green); font-size:.78rem; letter-spacing:.1em; }
    body.armed .flight-state { border-color:rgba(251,191,36,.42); background:rgba(251,191,36,.08); }
    body.armed .flight-state strong { color:var(--amber); }
    .command {
      appearance:none; flex-shrink:0; width:100%; min-width:0; min-height:48px;
      padding:6px 4px; border:1px solid var(--line); border-radius:13px;
      background:linear-gradient(180deg,#18212d,#10161e); color:var(--text);
      font-size:.7rem; font-weight:900; letter-spacing:.12em; cursor:pointer; touch-action:manipulation;
      box-shadow:inset 0 1px rgba(255,255,255,.04),0 4px 14px rgba(0,0,0,.22);
    }
    .command:disabled { opacity:.35; cursor:default; }
    #connectButton { color:var(--blue); border-color:rgba(56,189,248,.4); }
    #armButton { color:var(--green); border-color:rgba(74,222,128,.34); }
    body.armed #armButton { color:#10120b; border-color:var(--amber); background:var(--amber); }
    #stopButton { color:#fff; border-color:#d93650; background:linear-gradient(180deg,#e9445d,#bc2941); }
    .telemetry { flex:none; width:178px; max-width:100%; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    .metric {
      min-width:0; min-height:26px; display:flex; align-items:center; justify-content:center; gap:6px;
      padding:4px 6px; border:1px solid #202a38; border-radius:9px; background:rgba(17,23,32,.72);
    }
    .metric span { color:var(--muted); font-size:.48rem; font-weight:800; letter-spacing:.1em; }
    .metric b { color:#cbd5e1; font:700 .62rem/1 ui-monospace,monospace; white-space:nowrap; }
    footer { color:var(--muted); font-size:.61rem; }
    #message { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @supports(height:100dvh) { html,body,.app { height:100dvh; } }
    @media(orientation:portrait) {
      .app { grid-template-rows:42px minmax(0,1fr) 54px; }
      main { grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"center center" "left right"; gap:14px 10px; }
      .command-panel { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; align-self:start; }
      .flight-state,.command { min-height:58px; }
      footer { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto 26px; gap:4px; }
      .telemetry { width:100%; }
      .stick-name { font-size:.59rem; }
      .stick-value { font-size:.56rem; }
    }
    @media(max-width:720px) {
      .stick-head { flex-direction:column; align-items:flex-start; gap:4px; }
      .stick-name { font-size:.59rem; }
      .stick-value { font-size:.56rem; }
    }
    @media(max-width:480px) {
      .brand-sub { display:none; }
      .fullscreen-button { padding-inline:8px; }
      .link-state { padding-inline:9px; font-size:.62rem; }
    }
    @media(max-width:359px) and (orientation:portrait) {
      .brand-icon { display:none; }
      .brand-name { font-size:.72rem; }
      .command-panel { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .flight-state,.command { min-height:44px; }
      .flight-state { padding:5px; }
    }
    @media(max-height:480px) and (orientation:landscape) {
      .app { --edge:5px; grid-template-rows:34px minmax(0,1fr) 30px; gap:5px; }
      .brand-icon { width:28px; height:28px; }
      .brand-sub { display:none; }
      .command-panel { gap:6px; }
      .command { min-height:44px; }
      .flight-state { padding:7px; }
    }
    .command-panel.tight { gap:5px; }
    .command-panel.tight .command { min-height:38px; }
    .command-panel.tight .flight-state { padding:5px; }
    .command-panel.tight .flight-state strong { margin-top:3px; font-size:.7rem; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-icon">⌁</span><div class="brand-copy"><div id="brandName" class="brand-name">FLIGHT CONTROL</div><div class="brand-sub">DIRECT CONTROL LINK</div></div></div>
      <div class="header-actions"><button id="fullscreenButton" class="fullscreen-button" type="button" title="Enter fullscreen">FULL</button><div id="linkState" class="link-state"><span class="link-dot"></span><span id="linkText">NOT CONNECTED</span></div></div>
    </header>
    <main>
      <section class="stick-panel left">
        <div class="stick-head"><span class="stick-name">THROTTLE / YAW</span><span id="leftValue" class="stick-value">T 000 · Y +000</span></div>
        <div class="pad-wrap"><div class="pad"><span class="axis top">100%</span><span class="axis bottom">0%</span><span class="axis left">YAW −</span><span class="axis right">YAW +</span><div id="leftStick" class="stick-zone"></div></div></div>
      </section>
      <section id="commandPanel" class="command-panel">
        <div class="flight-state"><small>FLIGHT STATE</small><strong id="flightState">SAFE</strong></div>
        <button id="connectButton" class="command">CONNECT BLE</button>
        <button id="armButton" class="command" disabled>ARM</button>
        <button id="stopButton" class="command">STOP</button>
      </section>
      <section class="stick-panel right">
        <div class="stick-head"><span class="stick-name">ROLL / PITCH</span><span id="rightValue" class="stick-value">R +000 · P +000</span></div>
        <div class="pad-wrap"><div class="pad"><span class="axis top">PITCH +</span><span class="axis bottom">PITCH −</span><span class="axis left">ROLL −</span><span class="axis right">ROLL +</span><div id="rightStick" class="stick-zone"></div></div></div>
      </section>
    </main>
    <footer>
      <span id="message" role="status" aria-live="polite">Press CONNECT BLE to select a controller</span>
      <div class="telemetry" role="group" aria-label="Link statistics, 1.2-second average">
        <div class="metric" title="Average successful writes per second"><span>TX</span><b id="txRate">0 Hz</b></div>
        <div class="metric" title="Average round-trip time"><span>RTT</span><b id="rtt">-- ms</b></div>
      </div>
    </footer>
  </div>
  <script src="./nipplejs.min.js"></script>
  <script>
    (function(){
      'use strict';
      var CONFIG=Object.freeze(Object.assign({
        appName:'FLIGHT CONTROL',
        targetLabel:'controller',
        fallbackDeviceName:'BLE controller',
        serviceUuid:'d4f20001-8f69-4b7f-9f5a-6c253728d1a0',
        controlUuid:'d4f20002-8f69-4b7f-9f5a-6c253728d1a0',
        telemetryUuid:'d4f20003-8f69-4b7f-9f5a-6c253728d1a0',
        txIntervalMs:20
      },window.FLIGHT_CONTROL_CONFIG||{}));
      var SERVICE_UUID=CONFIG.serviceUuid;
      var CONTROL_UUID=CONFIG.controlUuid;
      var TELEMETRY_UUID=CONFIG.telemetryUuid;
      var configuredInterval=Number(CONFIG.txIntervalMs);
      var TX_INTERVAL_MS=Number.isFinite(configuredInterval)&&configuredInterval>0?Math.max(10,configuredInterval):20;
      var TELEMETRY_TIMEOUT_MS=2000;
      var METRICS_INTERVAL_MS=1200;
      var state={throttle:0,yaw:0,pitch:0,roll:0,armed:false,seq:0};
      var ble={
        session:0,device:null,control:null,telemetry:null,
        connected:false,connecting:false,disconnecting:false,
        busy:false,pending:null,active:null,lastError:'',
        disconnectHandler:null,telemetryHandler:null
      };
      var sent=0,lastRtt=null,lastTelemetryAt=null,reportedArmed=null,pendingTimes=new Map();
      var metricsStartedAt=performance.now(),rttSum=0,rttSamples=0;
      var nextControlTimer=null,lastControlQueuedAt=0;
      var armPending=false,stopPending=false,controlAction=0,renderFrame=null;
      var ui={};
      ['brandName','message','leftValue','rightValue','flightState','armButton','connectButton',
        'stopButton','linkState','linkText','fullscreenButton','leftStick','rightStick',
        'commandPanel','txRate','rtt'].forEach(function(id){ui[id]=document.getElementById(id)});
      var el=function(id){return ui[id]};
      var targetName=String(CONFIG.targetLabel||'controller');
      var targetSentence=targetName.charAt(0).toUpperCase()+targetName.slice(1);
      document.title=String(CONFIG.appName||'FLIGHT CONTROL');
      el('brandName').textContent=document.title;
      el('message').textContent='Press CONNECT BLE to select a '+targetName;
      function clamp(value,min,max){
        value=Number(value);
        return Math.max(min,Math.min(max,isFinite(value)?value:0))
      }
      function signed(value){
        var n=Math.round(value*100);
        return(n>=0?'+':'−')+String(Math.abs(n)).padStart(3,'0')
      }
      function setText(node,text){if(node.textContent!==text)node.textContent=text}
      function message(text){setText(ui.message,text);ui.message.title=text}
      function errorMessage(error){
        var fallback='Unknown Bluetooth error (no details returned)';
        if(error===null||error===undefined||error==='')return fallback;
        if(typeof error==='string')return error;
        var fields=['message','description','error','reason'];
        for(var i=0;i<fields.length;i++){
          if(typeof error[fields[i]]==='string'&&error[fields[i]])return error[fields[i]]
        }
        try{
          var details=JSON.stringify(error);
          if(details&&details!=='{}')return details
        }catch(ignored){}
        return typeof error.name==='string'&&error.name?error.name:fallback
      }
      function renderControls(){
        ui.armButton.disabled=!ble.connected||ble.connecting||ble.disconnecting||armPending||stopPending;
        ui.connectButton.disabled=ble.connecting||ble.disconnecting||stopPending;
        setText(ui.connectButton,ble.disconnecting?'DISCONNECT…':ble.connecting?'CONNECTING':ble.connected?'DISCONNECT':'CONNECT BLE');
        setText(ui.armButton,state.armed?'DISARM':'ARM')
      }
      function renderValues(){
        setText(ui.leftValue,'T '+String(Math.round(state.throttle*100)).padStart(3,'0')+' · Y '+signed(state.yaw));
        setText(ui.rightValue,'R '+signed(state.roll)+' · P '+signed(state.pitch))
      }
      function render(){
        renderValues();
        var flightText=stopPending?'STOPPING':armPending?(state.armed?'ARMING':'DISARMING'):
          reportedArmed===true?'ARMED':state.armed?'ARM SENT':reportedArmed===false||!ble.connected?'SAFE':'UNKNOWN';
        setText(ui.flightState,flightText);
        document.body.classList.toggle('armed',state.armed||reportedArmed===true);
        renderControls()
      }
      function scheduleRender(){
        if(renderFrame!==null)return;
        renderFrame=requestAnimationFrame(function(){renderFrame=null;renderValues()})
      }
      function setConnection(online,text){
        ble.connected=online;
        ui.linkState.classList.toggle('online',online);
        setText(ui.linkText,text);
        ui.linkText.title=text;
        renderControls()
      }
      function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement}
      function renderFullscreen(){
        var active=Boolean(fullscreenElement()),button=ui.fullscreenButton;
        setText(button,active?'EXIT':'FULL');
        button.title=active?'Exit fullscreen':'Enter fullscreen'
      }
      async function toggleFullscreen(){
        var target=document.documentElement,active=fullscreenElement();
        try{
          if(!active){
            var enter=target.requestFullscreen||target.webkitRequestFullscreen;
            if(!enter){message('Fullscreen is not supported by this browser.');return}
            await enter.call(target)
          }else{
            var exitFullscreen=document.exitFullscreen||document.webkitExitFullscreen;
            if(exitFullscreen)await exitFullscreen.call(document)
          }
        }catch(error){message('Unable to change fullscreen mode: '+errorMessage(error))}
      }
      function moveData(event,legacy){
        if(legacy&&legacy.vector)return legacy;
        if(event&&event.data&&event.data.vector)return event.data;
        if(event&&event.vector)return event;
        return null
      }
      if(!window.nipplejs||typeof window.nipplejs.create!=='function'){
        setConnection(false,'UI ERROR');
        message('NippleJS could not be loaded. Reload the page.');
        return
      }
      function stickDimensions(zone){
        var padSize=Math.min(zone.clientWidth,zone.clientHeight)||260;
        var ratio=window.matchMedia('(orientation: portrait)').matches ? .24 : .28;
        var thumbSize=Math.min(padSize-1,Math.max(28,Math.round(padSize*ratio)));
        return{thumb:thumbSize,track:Math.max(1,padSize-thumbSize)}
      }
      function fitPad(zone){
        var pad=zone.parentElement,wrap=pad.parentElement;
        var size=Math.max(1,Math.min(wrap.clientWidth,wrap.clientHeight,330));
        if(pad.style.width!==size+'px')pad.style.width=size+'px'
      }
      fitPad(ui.leftStick);
      fitPad(ui.rightStick);
      var common={
        mode:'static',position:{left:'50%',top:'50%'},
        size:stickDimensions(ui.leftStick).track,threshold:.03,fadeTime:80,restOpacity:1,
        color:{front:'linear-gradient(145deg,#7dd3fc,#0284c7)',back:'rgba(56,189,248,.14)'}
      };
      var left=nipplejs.create(Object.assign({},common,{zone:el('leftStick'),restJoystick:{x:true,y:false}}));
      var right=nipplejs.create(Object.assign({},common,{zone:el('rightStick'),restJoystick:true}));
      var leftGeometry,rightGeometry;
      function applyStickGeometry(manager,zone){
        fitPad(zone);
        var dimensions=stickDimensions(zone),trackSize=dimensions.track,thumbSize=dimensions.thumb;
        var joystick=manager.getJoystickByUid();
        manager.options.size=trackSize;
        if(!joystick)return{joystick:null,radius:trackSize/2};
        joystick.options.size=trackSize;
        Object.assign(joystick.ui.back.style,{
          width:trackSize+'px',height:trackSize+'px',
          marginLeft:-(trackSize/2)+'px',marginTop:-(trackSize/2)+'px'
        });
        Object.assign(joystick.ui.front.style,{
          width:thumbSize+'px',height:thumbSize+'px',
          marginLeft:-(thumbSize/2)+'px',marginTop:-(thumbSize/2)+'px'
        });
        return{joystick:joystick,radius:trackSize/2}
      }
      function positionFromState(geometry,x,y){
        if(!geometry.joystick)return;
        var length=Math.hypot(x,y),scale=length>1?1/length:1;
        geometry.joystick.setPosition(undefined,{x:x*scale*geometry.radius,y:-y*scale*geometry.radius})
      }
      function resetSticks(){
        positionFromState(leftGeometry,state.yaw,state.throttle*2-1);
        positionFromState(rightGeometry,state.roll,state.pitch)
      }
      function layoutSticks(){
        var landscape=window.matchMedia('(orientation: landscape)').matches;
        ui.commandPanel.classList.toggle('tight',landscape&&ui.commandPanel.clientHeight<205);
        leftGeometry=applyStickGeometry(left,ui.leftStick);
        rightGeometry=applyStickGeometry(right,ui.rightStick);
        resetSticks()
      }
      layoutSticks();
      var stickLayoutFrame=0;
      function scheduleStickLayout(){cancelAnimationFrame(stickLayoutFrame);stickLayoutFrame=requestAnimationFrame(layoutSticks)}
      window.addEventListener('resize',scheduleStickLayout);
      window.addEventListener('orientationchange',scheduleStickLayout);
      if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleStickLayout);
      if(window.ResizeObserver){
        var stickObserver=new ResizeObserver(scheduleStickLayout);
        stickObserver.observe(ui.leftStick.parentElement.parentElement);
        stickObserver.observe(ui.rightStick.parentElement.parentElement);
        stickObserver.observe(ui.commandPanel)
      }
      left.on('move',function(event,legacy){
        var data=moveData(event,legacy);
        if(!data)return;
        state.yaw=clamp(data.vector.x,-1,1);
        state.throttle=clamp((data.vector.y+1)/2,0,1);
        scheduleRender();
        requestControlUpdate()
      });
      left.on('end',function(){state.yaw=0;scheduleRender();requestControlUpdate()});
      right.on('move',function(event,legacy){
        var data=moveData(event,legacy);
        if(!data)return;
        state.roll=clamp(data.vector.x,-1,1);
        state.pitch=clamp(data.vector.y,-1,1);
        scheduleRender();
        requestControlUpdate()
      });
      right.on('end',function(){state.roll=0;state.pitch=0;scheduleRender();requestControlUpdate()});

      function crc16(bytes,length){
        var crc=0xffff;
        for(var i=0;i<length;i++){
          crc^=bytes[i]<<8;
          for(var bit=0;bit<8;bit++){
            crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff
          }
        }
        return crc
      }

      function makePacket(emergency){
        state.seq=(state.seq+1)&0xffff;
        var buffer=new ArrayBuffer(14),view=new DataView(buffer),bytes=new Uint8Array(buffer);
        view.setUint8(0,1);
        view.setUint8(1,(state.armed?1:0)|(emergency?2:0));
        view.setUint16(2,state.seq,true);
        view.setUint16(4,Math.round(clamp(state.throttle,0,1)*1000),true);
        view.setInt16(6,Math.round(clamp(state.yaw,-1,1)*1000),true);
        view.setInt16(8,Math.round(clamp(state.pitch,-1,1)*1000),true);
        view.setInt16(10,Math.round(clamp(state.roll,-1,1)*1000),true);
        view.setUint16(12,crc16(bytes,12),true);
        return buffer
      }

      function sendControl(emergency,withResponse){
        if(!ble.connected||!ble.control)return Promise.resolve(false);
        return new Promise(function(resolve){
          if(!ble.pending)ble.pending={session:ble.session,emergency:false,withResponse:false,waiters:[]};
          ble.pending.emergency=ble.pending.emergency||Boolean(emergency);
          ble.pending.withResponse=ble.pending.withResponse||Boolean(withResponse);
          ble.pending.waiters.push(resolve);
          flushControlQueue()
        })
      }

      function settleJob(job,success){
        if(job)job.waiters.splice(0).forEach(function(resolve){resolve(success)})
      }

      function currentSession(session){return session===ble.session}

      function requestControlUpdate(){
        if(!ble.connected||!ble.control)return;
        var now=performance.now(),delay=Math.max(0,TX_INTERVAL_MS-(now-lastControlQueuedAt));
        if(delay===0){lastControlQueuedAt=now;sendControl(false,false);return}
        if(nextControlTimer===null)nextControlTimer=setTimeout(function(){nextControlTimer=null;requestControlUpdate()},delay)
      }

      async function flushControlQueue(){
        if(ble.busy||!ble.pending||!ble.connected||!ble.control)return;
        var job=ble.pending,session=job.session,control=ble.control;
        ble.pending=null;
        ble.active=job;
        ble.busy=true;
        var packet=makePacket(job.emergency),seq=state.seq,success=false;
        pendingTimes.set(seq,performance.now());
        try{
          if(!job.withResponse&&typeof control.writeValueWithoutResponse==='function'&&(control.properties||{}).writeWithoutResponse){
            await control.writeValueWithoutResponse(packet)
          }else if(typeof control.writeValue==='function'){
            // Keep the API used by the working Bluefy-compatible version.
            await control.writeValue(packet)
          }else if(typeof control.writeValueWithResponse==='function'&&(control.properties||{}).write!==false){
            await control.writeValueWithResponse(packet)
          }else if(typeof control.writeValueWithoutResponse==='function'&&(control.properties||{}).writeWithoutResponse){
            await control.writeValueWithoutResponse(packet)
          }else{
            throw new Error('The control characteristic is not writable.')
          }
          if(currentSession(session)&&ble.active===job){sent++;success=true}
        }catch(error){
          if(currentSession(session)&&ble.active===job){
            pendingTimes.delete(seq);
            ble.lastError=errorMessage(error);
            message('BLE send failed: '+ble.lastError)
          }
        }
        finally{
          settleJob(job,success);
          // A completion from an old connection must never unlock a new one.
          if(currentSession(session)&&ble.active===job){
            ble.active=null;
            ble.busy=false;
            if(ble.pending)flushControlQueue()
          }
        }
      }

      function resetTelemetry(){
        sent=0;
        metricsStartedAt=performance.now();
        rttSum=0;
        rttSamples=0;
        lastRtt=null;
        lastTelemetryAt=null;
        reportedArmed=null;
        pendingTimes.clear();
        setText(ui.txRate,'0 Hz');
        setText(ui.rtt,'-- ms')
      }

      function updateMetrics(){
        var now=performance.now(),elapsed=now-metricsStartedAt;
        pendingTimes.forEach(function(started,seq){
          if(now-started>=TELEMETRY_TIMEOUT_MS)pendingTimes.delete(seq)
        });
        if(lastTelemetryAt!==null&&now-lastTelemetryAt>=TELEMETRY_TIMEOUT_MS){
          lastRtt=null;
          lastTelemetryAt=null;
          reportedArmed=null;
          render()
        }
        if(elapsed<METRICS_INTERVAL_MS)return;
        // Use real elapsed time: a delayed timer must not inflate the TX rate.
        setText(ui.txRate,Math.round(sent*1000/elapsed)+' Hz');
        lastRtt=rttSamples&&lastTelemetryAt!==null?Math.round(rttSum/rttSamples):null;
        setText(ui.rtt,lastRtt===null?'-- ms':lastRtt+' ms');
        sent=0;
        rttSum=0;
        rttSamples=0;
        metricsStartedAt=now
      }

      function onTelemetry(event){
        var view=event.target.value;
        if(!view||view.byteLength!==8)return;
        var bytes=new Uint8Array(view.buffer,view.byteOffset,view.byteLength);
        if(view.getUint8(0)!==1||view.getUint16(6,true)!==crc16(bytes,6))return;
        var flags=view.getUint8(1),seq=view.getUint16(2,true),started=pendingTimes.get(seq);
        var now=performance.now();
        lastTelemetryAt=now;
        // Existing telemetry flags: armed=1, failsafe=2, ARM rejected=4.
        reportedArmed=Boolean(flags&1);
        if(started!==undefined){
          var rtt=Math.max(0,now-started);
          if(rtt<TELEMETRY_TIMEOUT_MS){rttSum+=rtt;rttSamples++}
          pendingTimes.delete(seq)
        }
        if(flags&4){
          if(!stopPending)controlAction++;
          armPending=false;
          state.armed=false;
          reportedArmed=false;
          message(targetSentence+' rejected ARM: throttle must be ≤ 5%')
        }else if((flags&2)&&(state.armed||armPending)){
          if(!stopPending)controlAction++;
          armPending=false;
          state.armed=false;
          reportedArmed=false;
          message(targetSentence+' FAILSAFE active — system is SAFE')
        }
        render()
      }

      function clearConnection(status,text){
        ble.session++;
        controlAction++;
        if(ble.device&&ble.disconnectHandler)ble.device.removeEventListener('gattserverdisconnected',ble.disconnectHandler);
        if(ble.telemetry&&ble.telemetryHandler)ble.telemetry.removeEventListener('characteristicvaluechanged',ble.telemetryHandler);
        settleJob(ble.pending,false);
        settleJob(ble.active,false);
        if(nextControlTimer!==null)clearTimeout(nextControlTimer);
        nextControlTimer=null;
        lastControlQueuedAt=0;
        ble.device=null;
        ble.control=null;
        ble.telemetry=null;
        ble.connecting=false;
        ble.disconnecting=false;
        ble.busy=false;
        ble.pending=null;
        ble.active=null;
        ble.disconnectHandler=null;
        ble.telemetryHandler=null;
        armPending=false;
        stopPending=false;
        state.armed=false;
        resetTelemetry();
        setConnection(false,status);
        render();
        message(text)
      }

      function onDisconnected(event){
        if(event&&event.target!==ble.device)return;
        clearConnection('LINK LOST','Bluetooth disconnected — local ARM cleared; check the controller failsafe.')
      }

      async function connect(){
        if(ble.connecting||ble.disconnecting||stopPending)return false;
        if(!navigator.bluetooth||typeof navigator.bluetooth.requestDevice!=='function'){
          message('Web Bluetooth is unavailable. Use Chrome/Edge on Android or Bluefy on iOS.');
          return false
        }
        if(ble.connected){
          var disconnectSession=ble.session,previousDevice=ble.device;
          ble.disconnecting=true;
          renderControls();
          await stop();
          if(!currentSession(disconnectSession))return false;
          clearConnection('NOT CONNECTED','Disconnected — local controls are disarmed.');
          if(previousDevice&&previousDevice.gatt.connected)previousDevice.gatt.disconnect();
          return true
        }
        var session=++ble.session,device=null,stage='device selection';
        ble.connecting=true;
        ble.lastError='';
        function checkSession(){
          if(!currentSession(session))throw new Error('The connection attempt has expired.')
        }
        try{
          // Open the native chooser in the click handler before changing its button.
          var selection=navigator.bluetooth.requestDevice({filters:[{services:[SERVICE_UUID]}]});
          resetTelemetry();
          setConnection(false,'SELECT DEVICE');
          message('Select a compatible '+targetName+' in the Bluetooth device picker…');
          device=await selection;
          checkSession();
          ble.device=device;
          ble.disconnectHandler=function(event){if(currentSession(session))onDisconnected(event)};
          device.addEventListener('gattserverdisconnected',ble.disconnectHandler);
          setConnection(false,'CONNECTING');
          stage='GATT connect';
          var server=await device.gatt.connect();
          checkSession();
          stage='service discovery';
          var service=await server.getPrimaryService(SERVICE_UUID);
          checkSession();
          stage='control characteristic';
          var control=await service.getCharacteristic(CONTROL_UUID);
          checkSession();
          stage='telemetry characteristic';
          var telemetry=await service.getCharacteristic(TELEMETRY_UUID);
          checkSession();
          ble.control=control;
          ble.telemetry=telemetry;
          // Preserve the subscription order of commit 1f000e0 for BLE bridges.
          stage='notifications';
          await telemetry.startNotifications();
          checkSession();
          stage='telemetry listener';
          ble.telemetryHandler=function(event){
            if(currentSession(session)&&event.target===telemetry)onTelemetry(event)
          };
          telemetry.addEventListener('characteristicvaluechanged',ble.telemetryHandler);
          setConnection(true,'BLE OK');
          stage='initial control write';
          var initialized=await sendControl(true,true);
          checkSession();
          if(!initialized)throw new Error(ble.lastError||'The initial control command could not be sent.');
          ble.connecting=false;
          render();
          message('Connected to '+(device.name||CONFIG.fallbackDeviceName)+' — DISARM command sent.');
          return true
        }catch(error){
          if(currentSession(session)){
            var canceled=error&&error.name==='NotFoundError'&&!device;
            clearConnection('NOT CONNECTED',canceled?'Device selection was canceled':'BLE connection failed ['+stage+']: '+errorMessage(error))
          }
          if(device&&device!==ble.device&&device.gatt.connected)device.gatt.disconnect();
          return false
        }
      }

      async function stop(){
        if(stopPending)return false;
        var action=++controlAction,session=ble.session;
        armPending=false;
        stopPending=true;
        state.throttle=0;
        state.yaw=0;
        state.pitch=0;
        state.roll=0;
        state.armed=false;
        resetSticks();
        render();
        if(!ble.connected){
          stopPending=false;
          render();
          message('STOP — local controls reset; no Bluetooth connection.');
          return false
        }
        var success=await sendControl(true,true);
        if(!currentSession(session)||action!==controlAction)return false;
        stopPending=false;
        if(!success)reportedArmed=null;
        render();
        message(success?'STOP command sent — throttle 0%.':'STOP could not be sent — controller state is unconfirmed. '+ble.lastError);
        return success
      }

      async function toggleArm(){
        if(!ble.connected||ble.connecting||ble.disconnecting||armPending||stopPending)return false;
        if(!state.armed&&state.throttle>.05){message('Lower throttle to 0% before ARMING');return false}
        var action=++controlAction,session=ble.session,requested=!state.armed;
        state.armed=requested;
        armPending=true;
        render();
        var success=await sendControl(false,true);
        if(!currentSession(session)||action!==controlAction)return false;
        armPending=false;
        if(!success){state.armed=false;reportedArmed=null}
        render();
        var command=requested?'ARM':'DISARM';
        message(success?command+' command sent.':command+' could not be sent — controller state is unconfirmed. '+ble.lastError);
        return success
      }

      el('connectButton').addEventListener('click',connect);
      el('fullscreenButton').addEventListener('click',toggleFullscreen);
      el('armButton').addEventListener('click',toggleArm);
      el('stopButton').addEventListener('click',stop);
      function onFullscreenChange(){renderFullscreen();scheduleStickLayout()}
      document.addEventListener('fullscreenchange',onFullscreenChange);
      document.addEventListener('webkitfullscreenchange',onFullscreenChange);
      setInterval(requestControlUpdate,TX_INTERVAL_MS);
      setInterval(updateMetrics,METRICS_INTERVAL_MS);
      window.addEventListener('error',function(event){message('Interface error: '+errorMessage(event.error||event.message))});
      document.addEventListener('visibilitychange',function(){if(document.hidden&&state.armed)stop()});
      window.addEventListener('pagehide',function(){state.armed=false;sendControl(true,false)});
      render();renderFullscreen();setConnection(false,'NOT CONNECTED');
    })();
  </script>
</body>
</html>
